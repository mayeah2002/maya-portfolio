<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming soon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- הבמה: עמוד "בקרוב" לפי הפריים בפיגמה -->
  <main class="stage">

    <!-- היצור קבוע מאחורי האבן, והמשבצות נשארות כרקע -->
    <div class="rock-scene">
      <button
        class="alien-box"
        type="button"
        aria-label="היצור הירוק: רחפו מעליו או לחצו עליו כדי שיתחבא ויצוץ בחזרה"
      >
        <div class="rotated-box alien-box-content">
          <div class="alien">
            <div class="alien-body">
              <img src="images/alien-layer-1.png" alt="">
              <img src="images/alien-layer-2.png" alt="">
            </div>
            <div class="rotated-box alien-cigar-box">
              <img class="alien-cigar" src="images/alien-cigar.png" alt="">
            </div>
            <div class="alien-faces">
              <img src="images/alien-face-1.gif" alt="">
              <img src="images/alien-face-2.gif" alt="">
              <img src="images/alien-face-3.gif" alt="">
            </div>
          </div>
        </div>
      </button>
      <img class="rock" src="images/rock-cutout.png" alt="אבן">
    </div>

    <!-- הכיתוב נשאר בסידור המקורי ומעט קרוב יותר לאבן -->
    <h1 class="headline" aria-label="coming soon">
      <span class="rotated-box headline-comi" aria-hidden="true"><span class="headline-part"><span class="headline-letter">c</span><span class="headline-letter">o</span><span class="headline-letter">m</span><span class="headline-letter">i</span></span></span>
      <span class="rotated-box headline-ng" aria-hidden="true"><span class="headline-part"><span class="headline-letter">n</span><span class="headline-letter">g</span></span></span>
      <span class="headline-part headline-soon" aria-hidden="true"><span class="headline-letter">s</span><span class="headline-letter">o</span><span class="headline-letter">o</span><span class="headline-letter">n</span></span>
    </h1>

    <div class="fish-interactive-group">
      <!-- מסגרת הבחירה והדג נמתחים יחד כשגוררים את נקודות המסגרת -->
      <div class="rotated-box selection-frame-box">
        <div class="selection-frame">
          <svg class="selection-art" width="639.078" height="350.492" viewBox="0 0 639.078 350.492" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="מסגרת בחירה שאפשר למתוח">
            <rect x="67.1224" y="11" width="569.456" height="322" stroke="#006AA7" stroke-width="5"/>
            <rect class="resize-handle" data-resize-handle="top-left" role="button" tabindex="0" aria-label="מתיחת הפינה השמאלית העליונה" x="55.5701" y="3.99222" width="22" height="22" fill="#D9D9D9" stroke="#006AA7" stroke-width="5"/>
            <rect class="resize-handle" data-resize-handle="bottom-left" role="button" tabindex="0" aria-label="מתיחת הפינה השמאלית התחתונה" x="55.5701" y="325.992" width="22" height="22" fill="#D9D9D9" stroke="#006AA7" stroke-width="5"/>
            <path d="M3.57009 174.492H60.5701" stroke="#006AA7" stroke-width="5"/>
            <path class="resize-handle" data-resize-handle="left-middle" role="button" tabindex="0" aria-label="מתיחת הצד השמאלי" d="M75.5944 175.992C75.5944 180.976 71.5541 185.017 66.5701 185.017C61.5861 185.017 57.5457 180.976 57.5457 175.992C57.5457 171.008 61.5861 166.968 66.5701 166.968C71.5541 166.968 75.5944 171.008 75.5944 175.992Z" fill="#E0E0E0" stroke="#006AA7" stroke-width="5"/>
            <path class="rotation-handle" data-rotate-handle role="button" tabindex="0" aria-label="סיבוב הדג והמסגרת" d="M20.5487 174.787C20.5487 179.771 16.5083 183.811 11.5243 183.811C6.54033 183.811 2.5 179.771 2.5 174.787C2.5 169.803 6.54033 165.762 11.5243 165.762C16.5083 165.762 20.5487 169.803 20.5487 174.787Z" fill="#E0E0E0" stroke="#006AA7" stroke-width="5"/>
          </svg>
        </div>
      </div>
      <button class="rotated-box handle-box handle-top" type="button" data-resize-handle="top-right" aria-label="מתיחת הפינה הימנית העליונה" title="מתיחת הפינה הימנית העליונה">
        <span class="handle-square"></span>
      </button>
      <button class="rotated-box handle-box handle-bottom" type="button" data-resize-handle="bottom-right" aria-label="מתיחת הפינה הימנית התחתונה" title="מתיחת הפינה הימנית התחתונה">
        <span class="handle-square"></span>
      </button>
      <button class="rotated-box handle-dot-box" type="button" data-resize-handle="right-middle" aria-label="מתיחת הצד הימני" title="מתיחת הצד הימני">
        <img class="handle-dot" src="images/selection-dot.svg" width="23.049" height="23.049" alt="">
      </button>

      <!-- הדג נמתח יחד עם המסגרת, בלי לשמור על היחס בין רוחב לגובה -->
      <div class="rotated-box fish-box">
        <div class="fish">
          <img src="images/fish.png" alt="">
        </div>
      </div>
    </div>

    <a class="process-link" href="process.html">תהליך</a>

  </main>

  <script src="script.js"></script>
</body>
</html>
