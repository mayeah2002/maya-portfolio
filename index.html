<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming soon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- הבמה: עמוד "בקרוב" לפי הפריים בפיגמה -->
  <main class="stage home-stage">

    <!-- היצור קבוע מאחורי האבן, והמשבצות נשארות כרקע -->
    <div class="rock-scene">
      <button
        class="alien-box"
        type="button"
        aria-label="היצור הירוק: רחפו מעליו או לחצו עליו כדי שיתחבא ויצוץ בחזרה"
      >
        <div class="rotated-box alien-box-content">
          <div class="alien">
            <div class="alien-body">
              <img src="images/alien-layer-1.png" alt="">
              <img src="images/alien-layer-2.png" alt="">
            </div>
            <div class="rotated-box alien-cigar-box">
              <img class="alien-cigar" src="images/alien-cigar.png" alt="">
            </div>
            <div class="alien-faces">
              <img src="images/alien-face-1.gif" alt="">
              <img src="images/alien-face-2.gif" alt="">
              <img src="images/alien-face-3.gif" alt="">
            </div>
          </div>
        </div>
      </button>
      <img class="rock" src="images/rock-cutout.png" alt="אבן">
    </div>

    <!-- הכיתוב: האותיות c-o-m-i יושבות אחת-אחת על קו הצד של האבן -->
    <h1 class="headline" aria-label="coming soon">
      <span class="headline-part headline-letter rock-letter rock-letter-c" aria-hidden="true">c</span>
      <span class="headline-part headline-letter rock-letter rock-letter-o" aria-hidden="true">o</span>
      <span class="headline-part headline-letter rock-letter rock-letter-m" aria-hidden="true">m</span>
      <span class="headline-part headline-letter rock-letter rock-letter-i" aria-hidden="true">i</span>
      <!-- n-g ממשיכות מהפינה של האבן בירידה אל האדמה -->
      <span class="headline-part headline-letter rock-letter slope-letter-n" aria-hidden="true">n</span>
      <span class="headline-part headline-letter rock-letter slope-letter-g" aria-hidden="true">g</span>
      <span class="headline-part headline-soon" aria-hidden="true"><span class="headline-letter">s</span><span class="headline-letter">o</span><span class="headline-letter">o</span><span class="headline-letter">n</span></span>
    </h1>

    <div class="fish-interactive-group">
      <!-- מסגרת הבחירה: הרוחב והגובה שלה גדלים כשמותחים,
           אבל עובי הקו והידיות נשארים באותו גודל -->
      <div class="rotated-box selection-frame-box">
        <div class="selection-frame">
          <div class="selection-outline">
            <!-- הקו שמחבר את ידית הסיבוב למסגרת -->
            <span class="rotation-arm" aria-hidden="true"></span>
            <button class="frame-handle rotation-handle" type="button" data-rotate-handle aria-label="סיבוב הדג והמסגרת" title="סיבוב הדג והמסגרת"></button>
            <button class="frame-handle square-handle" type="button" data-resize-handle="top-left" aria-label="מתיחת הפינה השמאלית העליונה" title="מתיחת הפינה השמאלית העליונה"></button>
            <button class="frame-handle square-handle" type="button" data-resize-handle="bottom-left" aria-label="מתיחת הפינה השמאלית התחתונה" title="מתיחת הפינה השמאלית התחתונה"></button>
            <button class="frame-handle square-handle" type="button" data-resize-handle="top-right" aria-label="מתיחת הפינה הימנית העליונה" title="מתיחת הפינה הימנית העליונה"></button>
            <button class="frame-handle square-handle" type="button" data-resize-handle="bottom-right" aria-label="מתיחת הפינה הימנית התחתונה" title="מתיחת הפינה הימנית התחתונה"></button>
            <button class="frame-handle dot-handle" type="button" data-resize-handle="left-middle" aria-label="מתיחת הצד השמאלי" title="מתיחת הצד השמאלי"></button>
            <button class="frame-handle dot-handle" type="button" data-resize-handle="right-middle" aria-label="מתיחת הצד הימני" title="מתיחת הצד הימני"></button>
          </div>
        </div>
      </div>

      <!-- הדג נמתח יחד עם המסגרת, בלי לשמור על היחס בין רוחב לגובה -->
      <div class="fish-stretch">
        <div class="rotated-box fish-box">
          <div class="fish">
            <img src="images/fish.png" alt="">
          </div>
        </div>
      </div>
    </div>

    <a class="process-link" href="process.html">תהליך</a>

  </main>

  <script src="script.js"></script>
</body>
</html>
